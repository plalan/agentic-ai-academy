<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
<style>
:root {
  --bg: #0e131c; --bg2: #141b27; --card: #1a2231; --card2: #212b3d; --line: #2a3548;
  --text: #e8ecf3; --muted: #9aa6b8; --dim: #6c7a8f;
  --accent: #f4a261; --accent2: #2ec4b6; --good: #57cc99; --bad: #ef6f6c; --warn: #ffd166; --violet: #9d8df1;
  --code: #0b1018; --shadow: 0 8px 28px rgba(0,0,0,.35);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
[data-theme="light"] {
  --bg: #f6f3ee; --bg2: #efe9e0; --card: #ffffff; --card2: #f7f3ec; --line: #e2dbcf;
  --text: #1d2433; --muted: #5b6577; --dim: #8a93a3;
  --accent: #d9771f; --accent2: #13998d; --good: #2e9d6a; --bad: #d64545; --warn: #b8860b; --violet: #6a5acd;
  --code: #1d2433; --shadow: 0 6px 20px rgba(60,40,10,.10);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
button { font: inherit; cursor: pointer; }
a { color: var(--accent2); }
code { font-family: var(--mono); font-size: .9em; background: var(--card2); padding: 1px 6px; border-radius: 5px; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 270px 1fr; grid-template-rows: 64px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: var(--bg2); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .2px; }
.brand .logo { font-size: 24px; }
.brand small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: .3px; }
.xpwrap { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.level { background: linear-gradient(135deg, var(--accent), var(--violet)); color: #fff; font-weight: 700;
  border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.xpbar { width: 180px; height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.xpbar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .6s; }
.xptext { font-size: 12.5px; color: var(--muted); min-width: 92px; }
.iconbtn { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 10px; }
.iconbtn:hover { border-color: var(--accent); }

nav { background: var(--bg2); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 30px; }
.navitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
  color: var(--text); padding: 9px 10px; border-radius: 10px; margin-bottom: 2px; }
.navitem:hover { background: var(--card); }
.navitem.active { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); }
.navitem .ic { font-size: 18px; width: 24px; text-align: center; }
.navitem .t { flex: 1; font-size: 13.5px; line-height: 1.3; }
.navitem .mini { height: 4px; background: var(--card2); border-radius: 9px; margin-top: 5px; overflow: hidden; }
.navitem .mini > div { height: 100%; background: var(--accent2); }
.navitem .badge-ok { font-size: 14px; }
.navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin: 16px 10px 6px; }

main { overflow-y: auto; padding: 28px 34px 60px; }
.wrap { max-width: 1080px; margin: 0 auto; }

/* ---------- cards & common ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
h1 { font-size: 28px; margin: 0 0 6px; line-height: 1.2; } h2 { font-size: 21px; margin: 0 0 10px; } h3 { font-size: 16.5px; margin: 0 0 8px; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 13px; }
.btn { background: var(--accent); color: #1b1206; border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 650; }
.btn:hover { filter: brightness(1.08); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 550; }
.btn.ghost:hover { border-color: var(--accent); }
.btn.teal { background: var(--accent2); color: #04201d; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
.pill.good { color: var(--good); border-color: var(--good); } .pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.acc { color: var(--accent); border-color: var(--accent); } .pill.teal { color: var(--accent2); border-color: var(--accent2); }
.pill.vio { color: var(--violet); border-color: var(--violet); }
input[type=text], textarea, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; font: inherit; }
textarea { font-family: var(--mono); font-size: 13px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
pre.code { background: var(--code); color: #dfe7f2; border-radius: 12px; padding: 14px 16px; overflow-x: auto;
  font: 12.8px/1.55 var(--mono); margin: 12px 0 0; position: relative; border: 1px solid var(--line); }
.copy { position: absolute; top: 8px; right: 8px; font-size: 11.5px; padding: 3px 8px; border-radius: 7px;
  background: rgba(255,255,255,.08); color: #dfe7f2; border: 1px solid rgba(255,255,255,.15); }
.callout { border-left: 4px solid var(--accent2); background: var(--card2); padding: 12px 14px; border-radius: 0 12px 12px 0; margin-top: 12px; }
.callout.warn { border-color: var(--warn); } .callout.good { border-color: var(--good); } .callout.bad { border-color: var(--bad); }
.callout.acc { border-color: var(--accent); }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: stretch; }
.hero .card:first-child { background: linear-gradient(135deg, var(--card), var(--card2)); }
.stat { text-align: center; padding: 16px; }
.stat b { display: block; font-size: 26px; color: var(--accent); }
.modcard { cursor: pointer; transition: transform .15s, border-color .15s; position: relative; }
.modcard:hover { transform: translateY(-2px); border-color: var(--accent); }
.modcard .num { position: absolute; top: 14px; right: 16px; color: var(--dim); font-weight: 700; }
.modcard .ic { font-size: 30px; }
.bar { height: 7px; background: var(--card2); border-radius: 9px; overflow: hidden; margin-top: 12px; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }

/* ---------- module ---------- */
.modhead { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.modhead .ic { font-size: 44px; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tab { background: none; border: 0; color: var(--muted); padding: 10px 14px; border-bottom: 2px solid transparent; font-weight: 600; }
.tab.active { color: var(--text); border-color: var(--accent); }
.tab .ok { color: var(--good); }
.lessondots { display: flex; gap: 6px; margin-bottom: 14px; }
.lessondots span { width: 30px; height: 6px; border-radius: 9px; background: var(--card2); cursor: pointer; }
.lessondots span.done { background: var(--accent2); } .lessondots span.cur { background: var(--accent); }
.lesson p { margin: 0 0 12px; font-size: 15.5px; }
.analogy { display: flex; gap: 12px; background: var(--card2); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 6px; }
.analogy .e { font-size: 22px; }

/* ---------- quiz ---------- */
.opt { display: block; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--line); color: var(--text);
  border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.opt:hover:not(:disabled) { border-color: var(--accent2); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--card2)); }
.opt:disabled { cursor: default; }

/* ---------- tutor ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #1b1206; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--card2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg .src { font-size: 11.5px; color: var(--dim); margin-top: 6px; }
.chip { background: var(--card2); border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 5px 12px; font-size: 13px; }
.chip:hover { color: var(--text); border-color: var(--accent2); }
.typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }

/* ---------- labs ---------- */
.lab h3 { display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 150px 1fr 120px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.block { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 13px var(--mono); color: var(--text); }
.block:hover { border-color: var(--accent2); }
.pipe { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: 12px; }
.pipe .block { background: color-mix(in srgb, var(--accent2) 16%, var(--card2)); border-color: var(--accent2); }
.pipe .sep { color: var(--accent); font: 700 18px var(--mono); }
.heat td { width: 48px; height: 40px; text-align: center; font: 12px var(--mono); border-radius: 6px; color: #0b1018; }
.heat th { font: 600 12px var(--sans); color: var(--muted); padding: 2px 6px; }
.chunkview { font: 13px/1.9 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.chunkview span { border-radius: 4px; padding: 1px 0; }
.result { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card2); }
.result mark { background: color-mix(in srgb, var(--warn) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.trace { font: 13px/1.6 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-height: 340px; overflow-y: auto; }
.trace .th { color: var(--violet); } .trace .ac { color: var(--accent); } .trace .ob { color: var(--accent2); } .trace .er { color: var(--bad); }
.toolbtn { background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 10px 12px; text-align: left; }
.toolbtn:hover { border-color: var(--accent); }
.toolbtn b { font-family: var(--mono); font-size: 13px; color: var(--accent); }
svg text { font-family: var(--sans); }
.gnode rect { fill: var(--card2); stroke: var(--line); stroke-width: 1.5; transition: all .25s; }
.gnode text { fill: var(--text); font-size: 12.5px; }
.gnode.cur rect { fill: color-mix(in srgb, var(--accent) 30%, var(--card2)); stroke: var(--accent); stroke-width: 3; }
.gnode.seen rect { stroke: var(--accent2); }
.gedge { stroke: var(--line); stroke-width: 2; fill: none; transition: stroke .25s; }
.gedge.hot { stroke: var(--accent); stroke-width: 3; }
.statebox { font: 12.5px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; white-space: pre-wrap; min-height: 240px; }
.agent { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card2); cursor: pointer; text-align: left; color: var(--text); }
.agent.on { border-color: var(--accent2); box-shadow: inset 0 0 0 1px var(--accent2); }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.tl { display: flex; gap: 10px; align-items: center; opacity: 0; transform: translateX(-8px); transition: all .35s; }
.tl.show { opacity: 1; transform: none; }
.tl .who { min-width: 170px; font-weight: 600; }
.dline { display: flex; align-items: center; gap: 8px; background: var(--code); color: #dfe7f2; font: 13px var(--mono); padding: 7px 10px; border-radius: 9px; margin: 5px 0; }
.dline .mv { margin-left: auto; display: flex; gap: 4px; }
.dline .mv button { background: rgba(255,255,255,.08); color: #dfe7f2; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 1px 8px; }
.sortcard { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.sortcard .q { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--muted); padding: 6px 12px; }
.seg button.on { background: var(--accent2); color: #04201d; font-weight: 650; }
.icard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card2); }
.icard .src { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 6px; }
.icard .body { font: 13.5px/1.55 var(--mono); }
.capstep { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; }
.capstep input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--accent2); }

.toast { position: fixed; bottom: 22px; right: 22px; background: var(--card); border: 1px solid var(--accent); border-radius: 12px;
  padding: 12px 16px; box-shadow: var(--shadow); transform: translateY(120px); opacity: 0; transition: all .35s; z-index: 50; }
.toast.show { transform: none; opacity: 1; }
.confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .7; } }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 64px auto 1fr; }
  nav { display: flex; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .navitem { min-width: 170px; } .navlabel { display: none; }
  .hero, .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .xpbar { width: 90px; } main { padding: 18px 16px 50px; }
  .kv { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo">🕸️</span><div>Agentic AI Academy<small>Learn agentic AI by building, locally</small></div></div>
    <div class="xpwrap">
      <span class="level" id="level">Lv 1</span>
      <div class="xpbar"><div id="xpfill" style="width:0%"></div></div>
      <span class="xptext" id="xptext">0 XP</span>
      <button class="iconbtn" id="themeBtn" title="Toggle light / dark">🌓</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
